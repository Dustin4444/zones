[package]
name = "zone-prover-core"
description = "no_std portable Zone batch prover core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
tempo-zone-contracts = { workspace = true, features = ["serde"] }
tempo-chainspec = { workspace = true, features = ["evm"] }
tempo-contracts.workspace = true
tempo-evm.workspace = true
tempo-precompiles.workspace = true
tempo-primitives = { git = "https://github.com/tempoxyz/tempo", rev = "ac33b5b86a79edb1b9284450ba1a87fc645c4bb7", default-features = false }
zone-precompiles = { workspace = true, default-features = false }
zone-primitives = { workspace = true, features = ["serde"] }

alloy-consensus = { workspace = true }
alloy-eips = { workspace = true }
alloy-evm = { workspace = true }
alloy-hardforks = { workspace = true }
alloy-primitives = { workspace = true, features = ["serde"] }
alloy-rlp.workspace = true
alloy-rpc-types-debug.workspace = true
alloy-sol-types = { workspace = true }
alloy-trie = { workspace = true, features = ["ethereum"] }
reth-trie-common = { workspace = true }
reth-trie-sparse = { workspace = true }
stateless-reth-trie-common = { package = "reth-trie-common", git = "https://github.com/paradigmxyz/reth", tag = "v2.3.0", default-features = false }
stateless-reth-trie-sparse = { package = "reth-trie-sparse", git = "https://github.com/paradigmxyz/reth", tag = "v2.3.0", default-features = false }
revm = { workspace = true }
revm-database = { workspace = true }
revm-database-interface = { workspace = true }
serde = { workspace = true, optional = true }

[features]
default = ["std", "serde"]
std = [
    "alloy-consensus/std",
    "alloy-eips/std",
    "alloy-evm/std",
    "alloy-primitives/std",
    "alloy-rlp/std",
    "alloy-sol-types/std",
    "alloy-trie/std",
    "reth-trie-common/std",
    "reth-trie-sparse/std",
    "revm/std",
    "revm-database/std",
    "revm-database-interface/std",
    "serde?/std",
    "tempo-chainspec/std",
    "tempo-contracts/std",
    "tempo-primitives/std",
    "tempo-zone-contracts/std",
    "zone-precompiles/std",
    "zone-primitives/std",
]
serde = [
    "dep:serde",
    "alloy-primitives/serde",
    "tempo-chainspec/serde",
    "tempo-zone-contracts/serde",
    "zone-primitives/serde",
]

[dev-dependencies]
alloy-network.workspace = true
alloy-signer-local.workspace = true
const-hex.workspace = true
k256.workspace = true
reth-primitives-traits.workspace = true
serde_json.workspace = true
