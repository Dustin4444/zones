tokio-tungstenite.workspace = true
tracing.workspace = true
url = "2"
zone-primitives = { workspace = true, features = ["std", "serde"] }

[features]
default = []
cli = ["zone-node/cli"]
jemalloc = ["zone-node/jemalloc"]
test-utils = [
  "zone-node/test-utils",
  "tempo-precompiles/test-utils",
]
