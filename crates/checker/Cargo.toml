[package]
name = "zone-checker"
description = "Observe-only Zone L2 checker ExEx"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
readme = "README.md"

[lints]
workspace = true

[dependencies]
# reth
reth-exex = { git = "https://github.com/paradigmxyz/reth", rev = "fc3f7da" }
reth-execution-types.workspace = true
reth-node-api.workspace = true
reth-storage-api.workspace = true

# alloy
alloy-consensus.workspace = true
alloy-eips.workspace = true
alloy-network.workspace = true
alloy-primitives.workspace = true
alloy-provider = { workspace = true, features = ["ws"] }
alloy-sol-types.workspace = true

# tempo
tempo-alloy.workspace = true

# zones
tempo-zone-contracts = { workspace = true, features = ["std"] }

# misc
eyre.workspace = true
futures.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
alloy-consensus = { workspace = true, features = ["std"] }
alloy-rlp.workspace = true
alloy-rpc-types-eth.workspace = true
alloy-transport.workspace = true
reth-ethereum-primitives.workspace = true
reth-primitives-traits = { workspace = true, features = ["std", "test-utils"] }
reth-provider = { workspace = true, features = ["test-utils"] }
tempo-primitives.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
