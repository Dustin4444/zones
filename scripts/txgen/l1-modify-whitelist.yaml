# Adds or removes one account from a TIP-403 whitelist policy.
chain_id: ${TXGEN_CHAIN_ID}

gas:
  max_fee_per_gas: ${TXGEN_MAX_FEE_PER_GAS}
  max_priority_fee_per_gas: ${TXGEN_MAX_PRIORITY_FEE_PER_GAS}

accounts:
  dev:
    mnemonic: "${TXGEN_MNEMONIC}"
    index: 0

artifacts:
  tip403_registry: abis/tip403-registry.json

templates:
  modify_whitelist:
    type: tempo
    from: { pool: dev, select: { index: 0 } }
    gas_limit: 2000000
    nonce_key:
      uniform:
        - 1
        - ${TXGEN_NONCE_LANES}
    call:
      to: "0x403c000000000000000000000000000000000000"
      abi: tip403_registry
      function: modifyPolicyWhitelist
      args:
        - ${TXGEN_POLICY_ID}
        - "${TXGEN_POLICY_ACCOUNT}"
        - ${TXGEN_POLICY_MEMBER}

mix:
  - template: modify_whitelist
    weight: 1
