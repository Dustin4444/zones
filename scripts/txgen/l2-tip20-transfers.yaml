# Randomized multi-sender L2 TIP-20 transfer spam. Policy correctness belongs
# to the Rust proptests; this primitive only measures sustained throughput.
chain_id: ${TXGEN_CHAIN_ID}

gas:
  max_fee_per_gas: ${TXGEN_MAX_FEE_PER_GAS}
  max_priority_fee_per_gas: ${TXGEN_MAX_PRIORITY_FEE_PER_GAS}

accounts:
  dev:
    mnemonic: "${TXGEN_MNEMONIC}"
    range:
      - 0
      - ${TXGEN_ACTIVE_ACCOUNTS}

artifacts:
  tip20: abis/tip20.json

templates:
  transfer:
    type: tempo
    from: { pool: dev, select: random }
    fee_token: "${TXGEN_FEE_TOKEN}"
    gas_limit: 1000000
    nonce_key:
      uniform:
        - 1
        - ${TXGEN_NONCE_LANES}
    call:
      to: "${TXGEN_TOKEN}"
      abi: tip20
      function: transfer
      args:
        - "${TXGEN_TRANSFER_RECIPIENT}"
        - ${TXGEN_TRANSFER_AMOUNT}

mix:
  - template: transfer
    weight: 1
