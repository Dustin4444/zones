# Creates one simple whitelist or blacklist policy. The runner parses
# TXGEN_POLICY_TYPE to the TIP-403 enum value before invoking this spec.
chain_id: ${TXGEN_CHAIN_ID}

gas:
  max_fee_per_gas: ${TXGEN_MAX_FEE_PER_GAS}
  max_priority_fee_per_gas: ${TXGEN_MAX_PRIORITY_FEE_PER_GAS}

accounts:
  dev:
    mnemonic: "${TXGEN_MNEMONIC}"
    index: 0

artifacts:
  tip403_registry: abis/tip403-registry.json

templates:
  create_policy:
    type: tempo
    gas_limit: 2000000
    nonce_key:
      uniform:
        - 1
        - ${TXGEN_NONCE_LANES}
    call:
      to: "0x403c000000000000000000000000000000000000"
      abi: tip403_registry
      function: createPolicy
      args: []

sequences:
  create_empty_blacklist:
    bindings:
      user:
        account: { pool: dev, select: { index: 0 } }
    steps:
      - template: create_policy
        with:
          from: { var: user.ref }
          call:
            args:
              - { var: user.address }
              - ${TXGEN_POLICY_TYPE}

mix:
  - sequence: create_empty_blacklist
    weight: 1
