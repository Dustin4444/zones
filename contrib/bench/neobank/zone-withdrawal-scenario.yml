version: 1

include:
  - ./neobank-scenario-fragments.yml

chains:
  l1:
    network: tempo
    rpc_url: "${L1_RPC_URL}"
    query_rpc_url: "${ZONES_BENCH_L1_QUERY_RPC_URL}"
    observation:
      mode: auto
      websocket_url: "${L1_WS_RPC_URL}"
      poll_interval: 50ms
    chain_id: ${ZONES_BENCH_EXPECTED_L1_CHAIN_ID}
    workload: ./l1-onramp.yml

  zone:
    network: tempo
    rpc_url: "${ZONE_REDACTED_RPC_URL}"
    query_rpc_url: "${ZONE_RPC_URL}"
    observation:
      mode: auto
      websocket_url: "${ZONE_WS_RPC_URL}"
      poll_interval: 50ms
    request_auth:
      sender_header:
        name: X-Authorization-Token
        map: "${ZONES_BENCH_ZONE_AUTH_MAP}"
        reload_interval: 1s
    chain_id: ${ZONES_BENCH_EXPECTED_ZONE_CHAIN_ID}
    workload: ./zone-flow.yml

scenario:
  name: neobank-zone-withdrawal
  execution: dag
  timeout: 10m

  bindings:
    account:
      account: { pool: users, select: lease }
    offramp_action_id:
      bytes32: { random_bytes: 32 }

  steps:
    - id: l1_before_offramp
      checkpoint: { chain: l1 }
      save: l1_before_offramp

    - id: zone_before_offramp
      checkpoint: { chain: zone }
      save: zone_before_offramp

    - id: offramp
      depends_on: [l1_before_offramp, zone_before_offramp]
      submit:
        chain: zone
        template: offramp
        with:
          from: { var: account.ref }
          fee_token: "${ZONES_BENCH_DLUSD}"
          call:
            args:
              - "${ZONES_BENCH_DLUSD}"
              - "${ZONES_BENCH_BRIDGE_WALLET}"
              - ${ZONES_BENCH_WITHDRAWAL_AMOUNT}
              - { var: offramp_action_id }
              - 0
              - { var: account.address }
              - "0x"
              - "0x"
      save: offramp

    - id: offramp_result
      depends_on: [zone_before_offramp, offramp]
      wait_log:
        chain: zone
        from_block: { var: zone_before_offramp.block_number }
        transaction_hash: { var: offramp.tx_hash }
        sender: { var: offramp.sender }
        address: "${ZONES_BENCH_OUTBOX}"
        abi: ZoneOutbox
        event: WithdrawalRequested
        where:
          sender: { var: account.address }
          token: "${ZONES_BENCH_DLUSD}"
          to: "${ZONES_BENCH_BRIDGE_WALLET}"
          amount: ${ZONES_BENCH_WITHDRAWAL_AMOUNT}
          fee: 0
          memo: { var: offramp_action_id }
          gasLimit: 0
          data: "0x"
          revealTo: "0x"
        max_block_range: 1000
      timeout: 45s
      save: offramp_result

    - id: offramp_processed
      depends_on: [l1_before_offramp, offramp]
      wait_log:
        chain: l1
        from_block: { var: l1_before_offramp.block_number }
        address: "${L1_PORTAL_ADDRESS}"
        abi: ZonePortal
        event: WithdrawalProcessed
        where:
          to: "${ZONES_BENCH_BRIDGE_WALLET}"
          senderTag:
            keccak256_packed:
              types: [address, bytes32]
              values: [{ var: account.address }, { var: offramp.tx_hash }]
          token: "${ZONES_BENCH_DLUSD}"
          amount: ${ZONES_BENCH_WITHDRAWAL_AMOUNT}
          callbackSuccess: true
        max_block_range: 1000
      save: offramp_processed

    - id: journey_complete
      depends_on: [offramp_result, offramp_processed]
      checkpoint: { chain: l1 }
